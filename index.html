    let shuffledQuestions = [];
    let userAnswers = [];
    let timeRemaining = 5400;
    let timerInterval;

    function shuffle(array) {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    }

    function startExam() {
      shuffledQuestions = shuffle(questions);
      shuffledQuestions.forEach(q => {
        const indices = [0, 1, 2, 3];
        const shuffledIndices = shuffle(indices);
        q.shuffledOptions = shuffledIndices.map(i => q.options[i]);
        q.correctIndex = shuffledIndices.indexOf(q.correct);
      });

      userAnswers = new Array(shuffledQuestions.length).fill(null);
      
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('examScreen').classList.remove('hidden');
      
      renderQuestions();
      startTimer();
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      let lastPassage = '';
      
      shuffledQuestions.forEach((q, index) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question-card';
        
        let passageHtml = '';
        if (q.passage && q.passage !== lastPassage) {
          passageHtml = `
            <div class="passage-box">
              <div class="passage-title">📖 阅读短文：</div>
              <div>${q.passage}</div>
            </div>
          `;
          lastPassage = q.passage;
        } else if (q.passage) {
          lastPassage = q.passage;
        } else {
          lastPassage = '';
        }
        
        let optionsHtml = '';
        q.shuffledOptions.forEach((option, optIndex) => {
          const isSelected = userAnswers[index] === optIndex;
          optionsHtml += `
            <div class="option ${isSelected ? 'selected' : ''}" onclick="selectAnswer(${index}, ${optIndex})">
              <span class="option-label">${String.fromCharCode(65 + optIndex)}.</span>
              <span>${option}</span>
            </div>
          `;
        });

        questionDiv.innerHTML = `
          ${passageHtml}
          <div class="question-header">
            <span class="question-number">${index + 1}</span>
            <span class="question-text">${q.question}</span>
          </div>
          <div class="options">
            ${optionsHtml}
          </div>
        `;
        
        container.appendChild(questionDiv);
      });

      updateProgress();
    }

    function selectAnswer(questionIndex, optionIndex) {
      userAnswers[questionIndex] = optionIndex;
      renderQuestions();
    }

    function updateProgress() {
      const answered = userAnswers.filter(a => a !== null).length;
      const percentage = (answered / shuffledQuestions.length) * 100;
      document.getElementById('progressBar').style.width = percentage + '%';
    }

    function startTimer() {
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimerDisplay();
        
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          submitExam();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      document.getElementById('timerDisplay').textContent = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function submitExam() {
      clearInterval(timerInterval);
      
      let correctCount = 0;
      shuffledQuestions.forEach((q, index) => {
        if (userAnswers[index] === q.correctIndex) {
          correctCount++;
        }
      });

      const score = Math.round((correctCount / shuffledQuestions.length) * 100);
      
      document.getElementById('examScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');
      document.getElementById('scoreDisplay').textContent = score;
    }

    function showReview() {
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('reviewScreen').classList.remove('hidden');
      
      const container = document.getElementById('reviewContainer');
      container.innerHTML = '';

      shuffledQuestions.forEach((q, index) => {
        const isCorrect = userAnswers[index] === q.correctIndex;
        const userAnswerText = userAnswers[index] !== null ? q.shuffledOptions[userAnswers[index]] : '未作答';
        const correctAnswerText = q.shuffledOptions[q.correctIndex];

        const reviewDiv = document.createElement('div');
        reviewDiv.className = 'review-question';
        
        let passageHtml = '';
        if (q.passage) {
          passageHtml = `
            <div class="passage-box" style="margin-bottom: 16px;">
              <div class="passage-title">📖 阅读短文：</div>
              <div>${q.passage}</div>
            </div>
          `;
        }
        
        reviewDiv.innerHTML = `
          ${passageHtml}
          <div class="question-header">
            <span class="question-number" style="background: ${isCorrect ? '#48bb78' : '#f56565'}">${index + 1}</span>
            <span class="question-text">${q.question}</span>
          </div>
          <div style="margin-top: 16px;">
            <div style="margin-bottom: 8px;">
              <strong>您的答案：</strong>
              <span style="color: ${isCorrect ? '#48bb78' : '#f56565'}; font-weight: bold;">
                ${userAnswerText}
              </span>
            </div>
            <div style="margin-bottom: 8px;">
              <strong>正确答案：</strong>
              <span style="color: #48bb78; font-weight: bold;">
                ${correctAnswerText}
              </span>
            </div>
          </div>
          <div class="explanation">
            <div class="explanation-title">📖 解析：</div>
            <div class="explanation-text">${q.explanation}</div>
          </div>
        `;
        
        container.appendChild(reviewDiv);
      });
    }

    function restartExam() {
      timeRemaining = 5400;
      userAnswers = [];
      shuffledQuestions = [];
      
      document.getElementById('reviewScreen').classList.add('hidden');
      document.getElementById('startScreen').classList.remove('hidden');
    }

    async function onConfigChange(newConfig) {
      const titleElement = document.getElementById('examTitle');
      const subtitleElement = document.getElementById('examSubtitle');
      const startButton = document.getElementById('startButton');
      const submitButton = document.getElementById('submitButton');

      if (titleElement) {
        titleElement.textContent = newConfig.exam_title || defaultConfig.exam_title;
      }
      if (subtitleElement) {
        subtitleElement.textContent = newConfig.exam_subtitle || defaultConfig.exam_subtitle;
      }
      if (startButton) {
        startButton.textContent = newConfig.start_button_text || defaultConfig.start_button_text;
      }
      if (submitButton) {
